services:
  - type: web
    name: trustyhomes
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn trustyhomes.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SITE_WHATSAPP_NUMBER
        value: "2348000000000"
      - key: DATABASE_URL
        fromDatabase:
          name: trustyhomes-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.7"

databases:
  - name: trustyhomes-db
    plan: free
