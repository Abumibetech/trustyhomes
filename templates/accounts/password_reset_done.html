{% extends "base.html" %}
{% block title %}Check your email — TrustyHomes{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:440px;text-align:center">
    <div class="panel reveal">
      <h1 style="font-size:1.4rem">📩 Check your inbox</h1>
      <p style="color:var(--ink-600)">If an account exists with that email, a password reset link is on its way. It can take a few minutes to arrive — check spam too.</p>
      <a href="{% url 'accounts:login' %}" class="btn btn-outline" style="margin-top:10px">Back to login</a>
    </div>
  </div>
</section>
{% endblock %}
